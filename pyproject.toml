[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-lore-research"
version = "0.1.0"
description = "Reproducible Genshin Impact text evidence and source-grounded research tools"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp>=2,<3",
    "numpy==2.5.3",
]

[project.optional-dependencies]
semantic = [
    "fastembed==0.7.4",
    "hnswlib==0.8.0",
]

[project.urls]
Repository = "https://github.com/Andrew05213/genshin-lore-research"
Issues = "https://github.com/Andrew05213/genshin-lore-research/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
