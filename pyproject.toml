[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-lore-database"
version = "0.1.0"
description = "Source-rebuildable Genshin Impact evidence database and bounded Research tools"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp>=2,<3",
    "numpy==2.5.3",
]

[project.optional-dependencies]
semantic = [
    "fastembed==0.7.4",
    "hnswlib==0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
