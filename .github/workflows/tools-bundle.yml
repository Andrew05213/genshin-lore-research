name: Source and dependency bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tools-bundle.yml'
      - 'scripts/maintenance/package_tools.py'
      - 'requirements-tools.lock'
      - 'requirements-wheel-build.*'

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked native wheel build dependencies
        run: python -m pip install --require-hashes -r requirements-wheel-build.lock
      - name: Build platform wheels from locked inputs
        run: |
          python -m pip wheel --no-build-isolation --require-hashes -r requirements-tools.lock -w wheelhouse
          python -m pip wheel --no-build-isolation --require-hashes -r requirements-wheel-build.lock -w wheelhouse
      - name: Package source and dependencies only
        run: python scripts/maintenance/package_tools.py --wheelhouse wheelhouse --output tools.zip
      - name: Verify offline installation
        run: |
          python -c "from zipfile import ZipFile; ZipFile('tools.zip').extractall('offline')"
          python -m venv offline/venv
          python -c "import subprocess,sys,pathlib; p=pathlib.Path('offline/venv')/('Scripts/python.exe' if sys.platform=='win32' else 'bin/python'); subprocess.run([str(p),'-m','pip','install','--no-index','--find-links','offline/wheelhouse','--require-hashes','-r','offline/install.lock'],check=True); subprocess.run([str(p),'-m','pip','install','--no-deps','--no-build-isolation','--no-index','-e','offline/source'],check=True); subprocess.run([str(p),'-m','pip','check'],check=True); subprocess.run([str(p),'offline/source/scripts/build.py','--help'],check=True); subprocess.run([str(p),'-c','import fastembed,hnswlib; import genshin_lore'],check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: tools-python312-${{ matrix.os }}
          path: tools.zip
          if-no-files-found: error
